name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      OPENGRAPH_REQUIRE_NATIVE: "1"  # a kernel that fails to compile fails the job
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Compiled kernels load
        run: >-
          uv run python -c "import opengraph.native as n; s = n.status(); print(s);
          assert n.kernels is not None and n.mpvm is not None, s"
      - run: uv run pytest
      - name: Pure Python fallbacks
        run: uv run pytest
        env:
          OPENGRAPH_PURE_PYTHON: "1"
      - run: uv run ruff check src tests setup.py
      - run: uv run mypy
