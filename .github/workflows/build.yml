name: Application builds

# A tag v1.2.3 builds a release. Start one by hand from the Actions tab at any time. A pull
# request builds only if it changes how the app is built: these jobs are slow, and macOS
# minutes are expensive.
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - .github/workflows/build.yml
      - .github/scripts/build_info.py
      - pyproject.toml

permissions:
  contents: read

env:
  # The Python everything is tested on; flet build would otherwise take the newest it can.
  PYTHON_VERSION: "3.13"
  FLET_CLI_NO_RICH_OUTPUT: "1"
  PYTHONUTF8: "1"

jobs:
  preflight:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.info.outputs.label }}
      version: ${{ steps.info.outputs.version }}
      build_number: ${{ steps.info.outputs.build_number }}
      flet: ${{ steps.info.outputs.flet }}
    steps:
      - uses: actions/checkout@v6
      - id: info
        run: python3 .github/scripts/build_info.py

  validate:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  windows:
    needs: [preflight, validate]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Build for Windows
        run: >-
          uv run --locked --no-dev --with flet-cli==${{ needs.preflight.outputs.flet }}
          flet build windows --yes --python-version ${{ env.PYTHON_VERSION }}
          --build-version ${{ needs.preflight.outputs.version }}
          --build-number ${{ needs.preflight.outputs.build_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: opengraph-windows-x86_64-${{ needs.preflight.outputs.label }}
          path: build/windows
          if-no-files-found: error

  linux:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Install what flet build needs on Linux
        run: |
          packages=$(uv run --locked --no-dev --with flet-cli==${{ needs.preflight.outputs.flet }} \
            python -c "from flet_cli.utils.linux_deps import linux_dependencies as d; print(*d)")
          sudo apt-get update
          sudo apt-get install -y $packages
      - name: Build for Linux
        run: >-
          uv run --locked --no-dev --with flet-cli==${{ needs.preflight.outputs.flet }}
          flet build linux --yes --python-version ${{ env.PYTHON_VERSION }}
          --build-version ${{ needs.preflight.outputs.version }}
          --build-number ${{ needs.preflight.outputs.build_number }}
      - name: Archive with executable permissions
        run: tar -czf build/opengraph-linux-x86_64-${{ needs.preflight.outputs.label }}.tar.gz -C build/linux .
      - uses: actions/upload-artifact@v7
        with:
          name: opengraph-linux-x86_64-${{ needs.preflight.outputs.label }}
          path: build/opengraph-linux-x86_64-${{ needs.preflight.outputs.label }}.tar.gz
          if-no-files-found: error

  macos:
    needs: [preflight, validate]
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x86_64
            runner: macos-15-intel
          - architecture: arm64
            runner: macos-15
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-suffix: ${{ matrix.architecture }}
      - name: Build for macOS
        run: >-
          uv run --locked --no-dev --with flet-cli==${{ needs.preflight.outputs.flet }}
          flet build macos --yes --python-version ${{ env.PYTHON_VERSION }}
          --arch ${{ matrix.architecture }}
          --build-version ${{ needs.preflight.outputs.version }}
          --build-number ${{ needs.preflight.outputs.build_number }}
      - name: Archive with permissions and symlinks
        run: tar -czf build/opengraph-macos-${{ matrix.architecture }}-${{ needs.preflight.outputs.label }}.tar.gz -C build/macos .
      - uses: actions/upload-artifact@v7
        with:
          name: opengraph-macos-${{ matrix.architecture }}-${{ needs.preflight.outputs.label }}
          path: build/opengraph-macos-${{ matrix.architecture }}-${{ needs.preflight.outputs.label }}.tar.gz
          if-no-files-found: error

  android:
    needs: [preflight, validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [apk, aab]
    env:
      FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD: ${{ secrets.ANDROID_KEY_STORE_PASSWORD }}
      FLET_ANDROID_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      FLET_ANDROID_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      # The Android SDK, NDK, Flutter and Gradle caches outgrow the runner's free disk;
      # drop preinstalled toolchains this job never uses.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
      - name: Use the release key, if this repository has one
        env:
          KEY_STORE: ${{ secrets.ANDROID_KEY_STORE_BASE64 }}
        run: |
          if [ -z "$KEY_STORE" ]; then
            echo "::warning::No ANDROID_KEY_STORE_BASE64 secret: this build has a debug signature, which can't be published or updated from."
            exit 0
          fi
          echo "$KEY_STORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Build Android ${{ matrix.target }}
        run: >-
          uv run --locked --no-dev --with flet-cli==${{ needs.preflight.outputs.flet }}
          flet build ${{ matrix.target }} --yes --python-version ${{ env.PYTHON_VERSION }}
          --build-version ${{ needs.preflight.outputs.version }}
          --build-number ${{ needs.preflight.outputs.build_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: opengraph-android-${{ matrix.target }}-${{ needs.preflight.outputs.label }}
          path: build/${{ matrix.target }}
          if-no-files-found: error
